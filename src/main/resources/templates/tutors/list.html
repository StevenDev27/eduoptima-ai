<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutores · EduOptima AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">EduOptima AI</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/students}">Estudiantes</a>
            <a class="nav-link" th:href="@{/tutors}">Tutores</a>
            <a class="nav-link" th:href="@{/optimize}">Optimizar</a>
            <a class="nav-link" th:href="@{/history}">Historial</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <h2>Tutores</h2>
        <a th:href="@{/tutors/new}" class="btn btn-primary">+ Nuevo tutor</a>
    </div>
    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-primary"><tr>
            <th>ID</th><th>Nombre</th><th>Especialidad</th><th>Capacidad</th><th>Acciones</th>
        </tr></thead>
        <tbody>
        <tr th:each="t : ${tutors}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.name}"></td>
            <td th:text="${t.specialty}"></td>
            <td th:text="${t.maxCapacity}"></td>
            <td>
                <a th:href="@{/tutors/edit/{id}(id=${t.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/tutors/delete/{id}(id=${t.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar tutor?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tutors)}"><td colspan="5" class="text-center text-muted">Sin tutores registrados</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
