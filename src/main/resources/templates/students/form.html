<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiante · EduOptima AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">EduOptima AI</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/students}">Estudiantes</a>
            <a class="nav-link" th:href="@{/tutors}">Tutores</a>
            <a class="nav-link" th:href="@{/optimize}">Optimizar</a>
            <a class="nav-link" th:href="@{/history}">Historial</a>
        </div>
    </div>
</nav>
<div class="container">
    <h2 th:text="${student.id == null} ? 'Nuevo estudiante' : 'Editar estudiante'"></h2>
    <form th:action="@{/students/save}" th:object="${student}" method="post" class="card card-body shadow-sm">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input th:field="*{name}" class="form-control">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Área temática</label>
            <input th:field="*{topic}" class="form-control">
            <span th:if="${#fields.hasErrors('topic')}" th:errors="*{topic}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Riesgo académico (1-5)</label>
            <input th:field="*{academicRisk}" class="form-control" type="number">
            <span th:if="${#fields.hasErrors('academicRisk')}" th:errors="*{academicRisk}" class="text-danger"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Prioridad (1-10)</label>
            <input th:field="*{priority}" class="form-control" type="number">
            <span th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}" class="text-danger"></span>
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/students}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
