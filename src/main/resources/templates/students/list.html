<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes · EduOptima AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">EduOptima AI</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/students}">Estudiantes</a>
            <a class="nav-link" th:href="@{/tutors}">Tutores</a>
            <a class="nav-link" th:href="@{/optimize}">Optimizar</a>
            <a class="nav-link" th:href="@{/history}">Historial</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <h2>Estudiantes</h2>
        <a th:href="@{/students/new}" class="btn btn-primary">+ Nuevo estudiante</a>
    </div>
    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-primary"><tr>
            <th>ID</th><th>Nombre</th><th>Tema</th><th>Riesgo (1-5)</th><th>Prioridad (1-10)</th><th>Acciones</th>
        </tr></thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td th:text="${s.topic}"></td>
            <td th:text="${s.academicRisk}"></td>
            <td th:text="${s.priority}"></td>
            <td>
                <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/students/delete/{id}(id=${s.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar estudiante?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(students)}"><td colspan="6" class="text-center text-muted">Sin estudiantes registrados</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
